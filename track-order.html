<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Track Order | MEDI POINT</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f9f9;
  color:#203b3d;
}

.header{
  background:#fff;
  padding:15px 6%;
  border-bottom:1px solid #e1eeee;
}

.brand{
  font-size:21px;
  font-weight:800;
  color:#087d80;
}

.wrap{
  width:92%;
  max-width:650px;
  margin:45px auto;
}

.box{
  background:#fff;
  border:1px solid #e0ebeb;
  border-radius:18px;
  padding:25px;
  box-shadow:0 8px 28px rgba(20,70,75,.08);
}

h1{
  text-align:center;
  font-size:27px;
  margin:0 0 8px;
}

.sub{
  text-align:center;
  color:#809193;
  font-size:12px;
  margin:0 0 25px;
}

label{
  font-size:13px;
  font-weight:700;
  display:block;
  margin-bottom:7px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #d5e4e5;
  border-radius:10px;
  outline:none;
  font-size:14px;
  text-transform:uppercase;
}

input:focus{
  border-color:#087d80;
  box-shadow:0 0 0 3px rgba(8,125,128,.08);
}

button{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#087d80;
  color:white;
  font-weight:700;
  cursor:pointer;
}

button:hover{
  background:#06696c;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.result{
  margin-top:25px;
}

.status-head{
  text-align:center;
  background:#eaf8f8;
  border-radius:12px;
  padding:17px;
}

.status-head b{
  display:block;
  font-size:19px;
  color:#087d80;
  margin-top:6px;
}

.status-head small{
  display:block;
  margin-top:6px;
  color:#718789;
}

.timeline{
  margin-top:22px;
}

.step{
  display:flex;
  gap:13px;
  position:relative;
  padding-bottom:22px;
}

.dot{
  width:30px;
  height:30px;
  flex:none;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#dce9e9;
  color:#71888a;
  font-size:12px;
  font-weight:700;
  z-index:2;
}

.step.active .dot{
  background:#087d80;
  color:white;
}

.line{
  position:absolute;
  left:14px;
  top:30px;
  height:calc(100% - 20px);
  border-left:2px solid #dce9e9;
}

.step.active .line{
  border-color:#087d80;
}

.step:last-child{
  padding-bottom:0;
}

.step h3{
  margin:4px 0 3px;
  font-size:14px;
}

.step p{
  margin:0;
  color:#8a9b9d;
  font-size:11px;
}

.details{
  margin-top:22px;
  padding-top:17px;
  border-top:1px dashed #d8e5e5;
  font-size:12px;
  line-height:1.8;
}

.medicines{
  margin-top:12px;
  padding:12px;
  background:#f7fbfb;
  border-radius:9px;
}

.medicine-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:7px 0;
  border-bottom:1px solid #e5eeee;
  font-size:12px;
}

.medicine-row:last-child{
  border-bottom:0;
}

.error{
  text-align:center;
  padding:20px;
  color:#b44;
  background:#fff4f4;
  border-radius:10px;
  font-size:12px;
}

.loading{
  text-align:center;
  padding:20px;
  color:#718789;
  font-size:12px;
}

.back{
  text-align:center;
  margin-top:18px;
}

.back a{
  color:#087d80;
  font-size:12px;
  font-weight:700;
  text-decoration:none;
}

.refresh{
  margin-top:12px;
  background:#eaf8f8;
  color:#087d80;
}

.refresh:hover{
  background:#d9f0f0;
}

@media(max-width:550px){

  .wrap{
    width:94%;
    margin:25px auto;
  }

  .box{
    padding:20px;
  }

  h1{
    font-size:24px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="brand">⚕️ MEDI POINT</div>
</header>

<main class="wrap">

<section class="box">

<h1>📦 Track Your Order</h1>

<p class="sub">
Enter your Medi Point Order ID
</p>

<form onsubmit="trackOrder(event)">

<label>
Order ID
</label>

<input
  id="orderId"
  placeholder="Example: MP-20260810-12345"
  required
>

<button
  id="trackBtn"
  type="submit"
>
🔎 Track Order
</button>

</form>

<div id="result" class="result"></div>

<div class="back">
<a href="order.html">
← Back to Order Page
</a>
</div>

</section>

</main>


<script type="module">

/* =========================================
   FIREBASE
========================================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey: "AIzaSyDDY8sEtMapyVhiQd5AfcRb599dsgFwMcE",

  authDomain: "medipoint-f4616.firebaseapp.com",

  projectId: "medipoint-f4616",

  storageBucket: "medipoint-f4616.firebasestorage.app",

  messagingSenderId: "180492377336",

  appId: "1:180492377336:web:5f6566cd6663ed43a12f0d",

  measurementId: "G-C8X32M4CKF"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================================
   ORDER STATUS
========================================= */

const steps = [

  "Order Placed",

  "Order Confirmed",

  "Preparing",

  "Out for Delivery",

  "Delivered"

];


/* =========================================
   TRACK ORDER
========================================= */

async function trackOrder(event){

  event.preventDefault();

  const input =
    document.getElementById("orderId");

  const result =
    document.getElementById("result");

  const button =
    document.getElementById("trackBtn");


  const id =
    input.value.trim().toUpperCase();


  if(!id){

    return;

  }


  button.disabled = true;

  button.textContent = "⏳ Searching...";


  result.innerHTML = `
    <div class="loading">
      🔎 Searching your order...
    </div>
  `;


  try{

    const orderRef =
      doc(db,"orders",id);

    const snap =
      await getDoc(orderRef);


    if(!snap.exists()){

      result.innerHTML = `
        <div class="error">

          ❌ Order not found.

          <br><br>

          Please check your Order ID
          and try again.

        </div>
      `;

      button.disabled = false;

      button.textContent =
        "🔎 Track Order";

      return;

    }


    /*
      First display the order
    */

    renderOrder({
      id:id,
      ...snap.data()
    });


    /*
      REAL-TIME LISTENER

      Admin changes status
      → customer tracking updates
    */

    onSnapshot(
      orderRef,
      (updatedSnap)=>{

        if(updatedSnap.exists()){

          renderOrder({

            id:id,

            ...updatedSnap.data()

          });

        }

      }
    );


  }catch(error){

    console.error(
      "TRACKING ERROR:",
      error
    );


    result.innerHTML = `
      <div class="error">

        ❌ Unable to load order.

        <br><br>

        ${escapeHTML(error.message)}

      </div>
    `;

  }


  button.disabled = false;

  button.textContent =
    "🔎 Track Order";

}


/* =========================================
   RENDER ORDER
========================================= */

function renderOrder(order){

  const result =
    document.getElementById("result");


  const status =
    order.status || "Order Placed";


  let current =
    steps.indexOf(status);


  if(current < 0){

    current = 0;

  }


  let html = `

    <div class="status-head">

      Current Status

      <b>
        ${escapeHTML(status)}
      </b>

      <small>
        Order ID: ${escapeHTML(order.id)}
      </small>

    </div>

    <div class="timeline">
  `;


  steps.forEach((step,index)=>{

    const active =
      index <= current;


    html += `

      <div class="step ${active ? "active" : ""}">

        <div class="dot">

          ${active ? "✓" : index + 1}

        </div>

        ${
          index < steps.length - 1
          ? `<div class="line"></div>`
          : ""
        }

        <div>

          <h3>
            ${step}
          </h3>

          <p>

            ${
              index === current
              ? "Current order status"
              : index < current
              ? "Completed"
              : "Order progress"

            }

          </p>

        </div>

      </div>

    `;

  });


  html += `

    </div>

    <div class="details">

      <b>👤 Customer:</b>
      ${escapeHTML(order.name || "N/A")}

      <br>

      <b>📱 Mobile:</b>
      ${escapeHTML(order.phone || "N/A")}

      <br>

      <b>💳 Payment:</b>
      ${escapeHTML(order.payment || "N/A")}

      <br>

      <b>💰 Total:</b>
      ₹${Number(order.total || 0).toFixed(2)}

  `;


  /*
    MEDICINES
  */

  if(
    Array.isArray(order.items) &&
    order.items.length
  ){

    html += `

      <div class="medicines">

        <b>💊 Medicines</b>

    `;


    order.items.forEach(item=>{

      const name =
        item.name ||
        item.medicineName ||
        item.title ||
        "Medicine";


      const qty =
        Number(
          item.quantity ||
          item.qty ||
          item.count ||
          1
        );


      const price =
        Number(
          item.price ||
          item.medicinePrice ||
          item.amount ||
          0
        );


      html += `

        <div class="medicine-row">

          <span>
            ${escapeHTML(name)}
            × ${qty}
          </span>

          <b>
            ₹${(price * qty).toFixed(2)}
          </b>

        </div>

      `;

    });


    html += `</div>`;

  }


  html += `

      <button
        class="refresh"
        onclick="location.reload()"
      >
        🔄 Refresh Tracking
      </button>

    </div>

  `;


  result.innerHTML = html;

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

  return String(value)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}


/* =========================================
   MAKE GLOBAL
========================================= */

window.trackOrder =
  trackOrder;


/* =========================================
   AUTO TRACK FROM URL
========================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const urlId =
  params.get("id");


if(urlId){

  document.getElementById("orderId").value =
    urlId.toUpperCase();

  /*
    Automatically track order
  */

  trackOrder(
    new Event("submit")
  );

}

</script>

</body>
</html>
