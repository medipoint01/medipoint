<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEDI POINT | Category</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f7fbfb;
  color:#173f46;
}

header{
  height:72px;
  background:#fff;
  border-bottom:1px solid #e2eeee;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  position:sticky;
  top:0;
  z-index:5;
}

.brand{
  display:flex;
  gap:10px;
  align-items:center;
  text-decoration:none;
  color:#174b53;
}

.mark{
  width:40px;
  height:40px;
  border-radius:7px;
  background:#1692a2;
  color:#fff;
  display:grid;
  place-items:center;
  font-size:28px;
  font-weight:bold;
}

.brand h2{
  margin:0;
  font-size:18px;
}

.brand small{
  font-size:8px;
  color:#77888a;
}

.header-buttons{
  display:flex;
  gap:8px;
}

.btn{
  border:0;
  border-radius:7px;
  padding:10px 15px;
  background:#eaf6f7;
  color:#17606a;
  font-weight:bold;
  cursor:pointer;
}

.cart{
  background:#148d9e;
  color:#fff;
}

.head{
  text-align:center;
  padding:38px 20px 25px;
}

.head h1{
  margin:0;
  color:#174f58;
  font-size:31px;
}

.head p{
  color:#78888b;
  font-size:13px;
}

.tools{
  max-width:1120px;
  margin:auto;
  padding:0 20px 22px;
}

.tools input{
  width:100%;
  padding:13px;
  border:1px solid #dce8e8;
  border-radius:8px;
  outline:0;
  font-size:14px;
}

.tools input:focus{
  border-color:#148d9e;
}

.grid{
  max-width:1120px;
  margin:auto;
  padding:0 20px 50px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.product{
  background:#fff;
  border:1px solid #e2eeee;
  border-radius:12px;
  padding:14px;
  box-shadow:0 6px 20px #123f4710;
  display:flex;
  flex-direction:column;
}

.pic{
  height:180px;
  border-radius:9px;
  background:#eef8f8;
  display:grid;
  place-items:center;
  overflow:hidden;
  font-size:52px;
}

.pic img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.product h3{
  margin:14px 0 6px;
  color:#174f58;
  font-size:16px;
}

.desc{
  font-size:12px;
  color:#7b898b;
  line-height:1.5;
  min-height:35px;
}

.price{
  display:block;
  margin-top:10px;
  color:#148b9c;
  font-size:19px;
  font-weight:800;
}

.add{
  width:100%;
  margin-top:11px;
  padding:10px;
  border:0;
  border-radius:7px;
  background:#148d9e;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.add:hover{
  background:#0d7482;
}

.empty{
  grid-column:1/-1;
  background:#fff;
  border:1px solid #e2eeee;
  border-radius:12px;
  padding:55px 20px;
  text-align:center;
  color:#78888b;
}

.empty strong{
  display:block;
  color:#174f58;
  font-size:19px;
  margin-bottom:8px;
}

.loading{
  grid-column:1/-1;
  background:#fff;
  border:1px solid #e2eeee;
  border-radius:12px;
  padding:55px 20px;
  text-align:center;
  color:#148d9e;
}

.error{
  grid-column:1/-1;
  background:#fff4f4;
  border:1px solid #f0d5d5;
  border-radius:12px;
  padding:35px 20px;
  text-align:center;
  color:#b44;
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#123f47;
  color:#fff;
  padding:12px 16px;
  border-radius:8px;
  display:none;
  z-index:50;
}

@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:550px){

  header{
    padding:0 4%;
  }

  .brand small{
    display:none;
  }

  .brand h2{
    font-size:16px;
  }

  .header-buttons .btn:first-child{
    display:none;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .head h1{
    font-size:26px;
  }
}
</style>
</head>

<body>

<header>

<a class="brand" href="index.html#products">

  <div class="mark">+</div>

  <div>
    <h2>MEDI POINT</h2>
    <small>Your Trusted Healthcare Partner</small>
  </div>

</a>

<div class="header-buttons">

  <button
    class="btn"
    onclick="location.href='index.html#products'">
    ← Categories
  </button>

  <button
    class="btn cart"
    onclick="location.href='order.html'">
    🛒 Cart
    <span id="cartCount"></span>
  </button>

</div>

</header>


<div class="head">

  <h1 id="title">Medicines</h1>

  <p>
    Medicines available in this category
  </p>

</div>


<div class="tools">

  <input
    id="search"
    type="text"
    placeholder="🔎 Search medicine..."
  >

</div>


<div id="grid" class="grid">

  <div class="loading">
    ⏳ Loading medicines...
  </div>

</div>


<div id="toast" class="toast"></div>


<script type="module">

/* =========================================
   FIREBASE
========================================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyDDY8sEtMapyVhiQd5AfcRb599dsgFwMcE",

  authDomain:
    "medipoint-f4616.firebaseapp.com",

  projectId:
    "medipoint-f4616",

  storageBucket:
    "medipoint-f4616.firebasestorage.app",

  messagingSenderId:
    "180492377336",

  appId:
    "1:180492377336:web:5f6566cd6663ed43a12f0d",

  measurementId:
    "G-C8X32M4CKF"
};


const app =
  initializeApp(firebaseConfig);


const db =
  getFirestore(app);


/* =========================================
   CATEGORY NAMES
========================================= */

const names = {

  "antibiotic":
    "Antibiotic",

  "cough-cold":
    "Cough & Cold",

  "cut-pain":
    "Cut & Pain",

  "wound-fever":
    "Wound & Fever",

  "baby-care":
    "Baby Care",

  "eye-care":
    "Eye Care",

  "skin-hair-care":
    "Skin & Hair Care",

  "itching":
    "Itching",

  "allergy":
    "Allergy",

  "multi-vitamin":
    "Multi Vitamin",

  "sexual-wellness":
    "Sexual Wellness",

  "feminine-care-hygiene":
    "Feminine Care / Hygiene",

  "period-care":
    "Period Care",

  "fracture-care":
    "Fracture Care",

  "sanitary-antiseptic":
    "Sanitary & Antiseptic",

  "baby-food":
    "Baby Food",

  "gastric-acidity":
    "Gastric & Acidity",

  "diabetes-bp-care":
    "Diabetes & BP Care",

  "calcium-iron":
    "Calcium & Iron",

  "first-aid-medical-supplies":
    "First Aid & Medical Supplies"

};


/* =========================================
   NORMALIZE CATEGORY
========================================= */

function normalizeCategory(value){

  return String(value || "")
    .toLowerCase()
    .trim()
    .replace(/&/g,"and")
    .replace(/\//g,"-")
    .replace(/\s+/g,"-")
    .replace(/[^a-z0-9-]/g,"")
    .replace(/-+/g,"-")
    .replace(/^-|-$/g,"");

}


/* =========================================
   GET CATEGORY FROM URL
========================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


/*
   Ab:
   ?cat=antibiotic
   ?category=antibiotic
   dono chalega
*/

let urlCategory =
  params.get("cat") ||
  params.get("category") ||
  "";


const selectedCategory =
  normalizeCategory(urlCategory);


/* =========================================
   PAGE TITLE
========================================= */

const categoryTitle =
  names[selectedCategory] ||
  urlCategory ||
  "Medicines";


document.getElementById("title").textContent =
  categoryTitle;


/* =========================================
   PRODUCTS
========================================= */

let products = [];


/* =========================================
   ESCAPE HTML
========================================= */

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
   MONEY
========================================= */

function money(value){

  return "₹" +
    Number(value || 0).toLocaleString("en-IN");

}


/* =========================================
   CATEGORY MATCH
========================================= */

function categoryMatches(productCategory){

  const productCat =
    normalizeCategory(productCategory);

  if(!selectedCategory){
    return true;
  }

  /*
     Direct match
  */

  if(productCat === selectedCategory){
    return true;
  }

  /*
     Name se match
     Example:
     "Cough & Cold"
     vs
     "cough-cold"
  */

  const selectedName =
    normalizeCategory(
      names[selectedCategory] ||
      selectedCategory
    );

  if(productCat === selectedName){
    return true;
  }

  /*
     Extra fallback
  */

  const productName =
    names[productCat] ||
    productCat;

  if(
    normalizeCategory(productName) ===
    selectedCategory
  ){
    return true;
  }

  return false;

}


/* =========================================
   LOAD FIREBASE MEDICINES
========================================= */

function loadMedicines(){

  const grid =
    document.getElementById("grid");


  onSnapshot(

    collection(db,"medicines"),

    (snapshot)=>{

      products = [];


      snapshot.forEach((docSnap)=>{

        products.push({

          id:docSnap.id,

          ...docSnap.data()

        });

      });


      console.log(
        "Firebase medicines:",
        products
      );


      render();

    },

    (error)=>{

      console.error(
        "Firebase medicines error:",
        error
      );


      grid.innerHTML = `

        <div class="error">

          ❌ Firebase Error

          <br><br>

          ${esc(error.message)}

        </div>

      `;

    }

  );

}


/* =========================================
   CART
========================================= */

function getCart(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "mediPointCart"
      ) || "[]"
    );

  }catch{

    return [];

  }

}


function saveCart(cart){

  localStorage.setItem(
    "mediPointCart",
    JSON.stringify(cart)
  );

}


/* =========================================
   ADD TO CART
========================================= */

window.addToCart =
function(id){

  const product =
    products.find(
      p => String(p.id) === String(id)
    );


  if(!product){

    showToast(
      "❌ Medicine not found"
    );

    return;

  }


  const cart =
    getCart();


  const existing =
    cart.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if(existing){

    existing.quantity =
      Number(existing.quantity || 1) + 1;

  }else{

    cart.push({

      id:product.id,

      name:product.name || "Medicine",

      price:Number(
        product.price || 0
      ),

      image:
        product.image ||
        product.photo ||
        product.imageUrl ||
        "",

      quantity:1

    });

  }


  saveCart(cart);


  updateCartCount();


  showToast(
    "✅ " +
    (product.name || "Medicine") +
    " added to cart"
  );

};


/* =========================================
   CART COUNT
========================================= */

function updateCartCount(){

  const cart =
    getCart();


  const count =
    cart.reduce(
      (total,item)=>{

        return total +
          Number(
            item.quantity || 1
          );

      },
      0
    );


  const element =
    document.getElementById(
      "cartCount"
    );


  if(element){

    element.textContent =
      count > 0
      ? ` (${count})`
      : "";

  }

}


/* =========================================
   RENDER
========================================= */

function render(){

  const grid =
    document.getElementById("grid");


  if(!grid){
    return;
  }


  const searchInput =
    document.getElementById("search");


  const search =
    searchInput
    ? searchInput.value
        .toLowerCase()
        .trim()
    : "";


  /*
     IMPORTANT:
     Firebase medicines ko category ke
     according filter kar rahe hain.
  */

  const list =
    products.filter(product=>{

      const productCategory =
        product.category ||
        product.cat ||
        product.categoryName ||
        "";


      const categoryOK =
        categoryMatches(
          productCategory
        );


      const nameOK =
        !search ||
        String(
          product.name || ""
        )
        .toLowerCase()
        .includes(search);


      return categoryOK && nameOK;

    });


  console.log(
    "Selected category:",
    selectedCategory
  );

  console.log(
    "Matching medicines:",
    list
  );


  if(!list.length){

    grid.innerHTML = `

      <div class="empty">

        <strong>
          No medicines found
        </strong>

        ${
          selectedCategory
          ?
          `
          Admin panel se
          <b>${esc(categoryTitle)}</b>
          category mein medicine add karo.
          `
          :
          `
          Please select a category.
          `
        }

      </div>

    `;

    updateCartCount();

    return;

  }


  grid.innerHTML = "";


  list.forEach(product=>{

    const article =
      document.createElement("article");


    article.className =
      "product";


    const image =
      product.image ||
      product.photo ||
      product.imageUrl ||
      "";


    article.innerHTML = `

      <div class="pic">

        ${
          image

          ?

          `
          <img
            src="${esc(image)}"
            alt="${esc(
              product.name || "Medicine"
            )}"
            onerror="
              this.style.display='none';
              this.parentElement.innerHTML='💊';
            "
          >
          `

          :

          `💊`
        }

      </div>


      <h3>
        ${esc(
          product.name ||
          "Medicine"
        )}
      </h3>


      <div class="desc">

        ${esc(
          product.details ||
          product.desc ||
          product.description ||
          "Quality healthcare product"
        )}

      </div>


      <span class="price">

        ${money(product.price)}

      </span>


      <button
        class="add"
        onclick="addToCart('${esc(product.id)}')">

        + Add to Cart

      </button>

    `;


    grid.appendChild(article);

  });


  updateCartCount();

}


/* =========================================
   SEARCH
========================================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    render
  );


/* =========================================
   TOAST
========================================= */

function showToast(text){

  const toast =
    document.getElementById("toast");


  toast.textContent =
    text;


  toast.style.display =
    "block";


  clearTimeout(
    window.toastTimer
  );


  window.toastTimer =
    setTimeout(()=>{

      toast.style.display =
        "none";

    },3000);

}


/* =========================================
   START
========================================= */

loadMedicines();

updateCartCount();

</script>

</body>
</html>
