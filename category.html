<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEDI POINT | Category</title>

<style>
*{
  box-sizing:border-box
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f7fbfb;
  color:#173f46
}

header{
  height:72px;
  background:#fff;
  border-bottom:1px solid #e2eeee;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  position:sticky;
  top:0;
  z-index:5
}

.brand{
  display:flex;
  gap:10px;
  align-items:center;
  text-decoration:none;
  color:#174b53
}

.mark{
  width:40px;
  height:40px;
  border-radius:7px;
  background:#1692a2;
  color:#fff;
  display:grid;
  place-items:center;
  font-size:28px;
  font-weight:bold
}

.brand h2{
  margin:0;
  font-size:18px
}

.brand small{
  font-size:8px;
  color:#77888a
}

.btn{
  border:0;
  border-radius:7px;
  padding:10px 15px;
  background:#eaf6f7;
  color:#17606a;
  font-weight:bold;
  cursor:pointer
}

.cart{
  background:#148d9e;
  color:#fff
}

.head{
  text-align:center;
  padding:38px 20px 25px
}

.head h1{
  margin:0;
  color:#174f58;
  font-size:31px
}

.head p{
  color:#78888b;
  font-size:13px
}

.tools{
  max-width:1120px;
  margin:auto;
  padding:0 20px 22px
}

.tools input{
  width:100%;
  padding:12px;
  border:1px solid #dce8e8;
  border-radius:8px;
  outline:0
}

.grid{
  max-width:1120px;
  margin:auto;
  padding:0 20px 50px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px
}

.product{
  background:#fff;
  border:1px solid #e2eeee;
  border-radius:12px;
  padding:14px;
  box-shadow:0 6px 20px #123f4710;
  display:flex;
  flex-direction:column
}

.pic{
  height:180px;
  border-radius:9px;
  background:#eef8f8;
  display:grid;
  place-items:center;
  overflow:hidden;
  font-size:52px
}

.pic img{
  width:100%;
  height:100%;
  object-fit:cover
}

.product h3{
  margin:14px 0 6px;
  color:#174f58;
  font-size:16px
}

.desc{
  font-size:12px;
  color:#7b898b;
  line-height:1.5;
  min-height:35px
}

.price{
  display:block;
  margin-top:10px;
  color:#148b9c;
  font-size:19px;
  font-weight:800
}

.add{
  width:100%;
  margin-top:11px;
  padding:10px;
  border:0;
  border-radius:7px;
  background:#148d9e;
  color:#fff;
  font-weight:bold;
  cursor:pointer
}

.add:hover{
  background:#0d7482
}

.empty{
  grid-column:1/-1;
  background:#fff;
  border:1px solid #e2eeee;
  border-radius:12px;
  padding:55px 20px;
  text-align:center;
  color:#78888b
}

.empty strong{
  display:block;
  color:#174f58;
  font-size:19px;
  margin-bottom:8px
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#123f47;
  color:#fff;
  padding:12px 16px;
  border-radius:8px;
  display:none;
  z-index:50
}

@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(2,1fr)
  }
}

@media(max-width:550px){
  .brand small{
    display:none
  }

  .grid{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<header>

<a class="brand" href="index.html#products">

<div class="mark">+</div>

<div>
<h2>MEDI POINT</h2>
<small>Your Trusted Healthcare Partner</small>
</div>

</a>

<div>

<button
class="btn"
onclick="location.href='index.html#products'">
← Categories
</button>

<button
class="btn cart"
onclick="location.href='order.html'">
🛒 Cart
</button>

</div>

</header>


<div class="head">

<h1 id="title">Medicines</h1>

<p>
Only medicines added from the Admin panel are shown here.
</p>

</div>


<div class="tools">

<input
id="search"
placeholder="🔎 Search medicine..."
oninput="render()"
>

</div>


<div id="grid" class="grid"></div>

<div id="toast" class="toast"></div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyDDY8sEtMapyVhiQd5AfcRb599dsgFwMcE",

  authDomain:
    "medipoint-f4616.firebaseapp.com",

  projectId:
    "medipoint-f4616",

  storageBucket:
    "medipoint-f4616.firebasestorage.app",

  messagingSenderId:
    "180492377336",

  appId:
    "1:180492377336:web:5f6566cd6663ed43a12f0d",

  measurementId:
    "G-C8X32M4CKF"

};


const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(app);


/* ==========================================
   CATEGORY
========================================== */

const names = {

  "antibiotic":
    "Antibiotic",

  "cough-cold":
    "Cough & Cold",

  "cut-pain":
    "Cut & Pain",

  "wound-fever":
    "Wound & Fever",

  "baby-care":
    "Baby Care",

  "eye-care":
    "Eye Care",

  "skin-hair-care":
    "Skin & Hair Care",

  "itching":
    "Itching",

  "allergy":
    "Allergy",

  "multi-vitamin":
    "Multi Vitamin",

  "sexual-wellness":
    "Sexual Wellness",

  "feminine-care-hygiene":
    "Feminine Care / Hygiene",

  "period-care":
    "Period Care",

  "fracture-care":
    "Fracture Care",

  "sanitary-antiseptic":
    "Sanitary & Antiseptic",

  "baby-food":
    "Baby Food",

  "gastric-acidity":
    "Gastric & Acidity",

  "diabetes-bp-care":
    "Diabetes & BP Care",

  "calcium-iron":
    "Calcium & Iron",

  "first-aid-medical-supplies":
    "First Aid & Medical Supplies"

};


/* ==========================================
   NORMALIZE CATEGORY
========================================== */

function normalizeCategory(value){

  return String(value || "")
    .toLowerCase()
    .trim()
    .replace(/&/g,"and")
    .replace(/\//g,"-")
    .replace(/\s+/g,"-")
    .replace(/[^a-z0-9-]/g,"")
    .replace(/-+/g,"-");

}


/* ==========================================
   URL CATEGORY
========================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const selectedCategory =
  normalizeCategory(
    params.get("cat")
  );


/* ==========================================
   PRODUCTS
========================================== */

let products = [];


/* ==========================================
   ESCAPE
========================================== */

function esc(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* ==========================================
   MONEY
========================================== */

function money(value){

  return "₹" +
    Number(
      value || 0
    ).toLocaleString(
      "en-IN"
    );

}


/* ==========================================
   FIREBASE LOAD
========================================== */

async function loadProducts(){

  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "medicines"
        )
      );


    const result = [];


    snapshot.forEach(function(item){

      result.push({

        id: item.id,

        ...item.data()

      });

    });


    return result;


  }catch(error){

    console.error(
      "Firebase error:",
      error
    );

    return [];

  }

}


/* ==========================================
   CART
========================================== */

function getCart(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "mediPointCart"
      ) || "[]"
    );

  }catch(error){

    return [];

  }

}


function saveCart(cart){

  localStorage.setItem(
    "mediPointCart",
    JSON.stringify(cart)
  );

}


/* ==========================================
   ADD TO CART
========================================== */

window.add = function(id){

  const product =
    products.find(
      function(p){

        return String(p.id) ===
          String(id);

      }
    );


  if(!product){

    alert(
      "Medicine not found."
    );

    return;

  }


  const cart =
    getCart();


  const existing =
    cart.find(
      function(item){

        return String(item.id) ===
          String(id);

      }
    );


  if(existing){

    existing.quantity =
      Number(
        existing.quantity || 1
      ) + 1;

  }else{

    cart.push({

      id: product.id,

      name: product.name,

      price: Number(
        product.price || 0
      ),

      image:
        product.image || "",

      quantity: 1

    });

  }


  saveCart(cart);


  alert(
    product.name +
    " added to cart ✓"
  );


  updateCartCount();

};


/* ==========================================
   CART COUNT
========================================== */

function updateCartCount(){

  const cart =
    getCart();


  const count =
    cart.reduce(
      function(total,item){

        return total +
          Number(
            item.quantity || 1
          );

      },
      0
    );


  const elements =
    document.querySelectorAll(
      ".cart-count"
    );


  elements.forEach(
    function(element){

      element.textContent =
        count;

    }
  );

}


/* ==========================================
   RENDER
========================================== */

window.render = function(){

  const grid =
    document.getElementById(
      "grid"
    );


  if(!grid){

    return;

  }


  const searchElement =
    document.getElementById(
      "search"
    );


  const search =
    searchElement
    ?
    searchElement
      .value
      .toLowerCase()
      .trim()
    :
    "";


  const list =
    products.filter(
      function(p){

        const category =
          normalizeCategory(
            p.category ||
            p.cat ||
            p.categoryName ||
            ""
          );


        const productName =
          String(
            p.name || ""
          )
          .toLowerCase();


        return (

          category ===
          selectedCategory

        )

        &&

        (

          !search ||

          productName.includes(
            search
          )

        );

      }
    );


  if(!list.length){

    grid.innerHTML = `

      <div class="empty">

        <strong>
          No medicines added yet
        </strong>

        <br><br>

        Admin panel se

        "${esc(
          names[selectedCategory]
          ||
          selectedCategory
          ||
          "this"
        )}"

        category mein medicine add karo.

      </div>

    `;

    return;

  }


  grid.innerHTML =

    list
    .map(
      function(p){

        const image =
          p.image ||
          p.photo ||
          p.imageUrl ||
          "";


        return `

          <article
            class="product"
          >

            <div class="pic">

              ${
                image

                ?

                `
                <img

                  src="${esc(image)}"

                  alt="${esc(
                    p.name
                  )}"

                  onerror="
                    this.style.display='none';
                    this.parentElement.innerHTML='💊';
                  "

                >
                `

                :

                `💊`

              }

            </div>


            <h3>

              ${esc(
                p.name
              )}

            </h3>


            <div class="desc">

              ${esc(
                p.desc ||
                p.description ||
                "Quality healthcare product"
              )}

            </div>


            <span class="price">

              ${money(
                p.price
              )}

            </span>


            <button

              class="add"

              onclick="
                add('${String(
                  p.id
                )}')
              "

            >

              + Add to Cart

            </button>


          </article>

        `;

      }
    )
    .join("");


  updateCartCount();

};


/* ==========================================
   SEARCH
========================================== */

const searchInput =
  document.getElementById(
    "search"
  );


if(searchInput){

  searchInput.addEventListener(
    "input",
    function(){

      render();

    }
  );

}


/* ==========================================
   PAGE START
========================================== */

(async function(){

  const grid =
    document.getElementById(
      "grid"
    );


  if(grid){

    grid.innerHTML = `

      <div class="empty">

        Loading medicines...

      </div>

    `;

  }


  products =
    await loadProducts();


  render();

})();
</script>

</body>
</html>
