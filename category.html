<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEDI POINT | Category</title>

<style>
*{
  box-sizing:border-box
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f7fbfb;
  color:#173f46
}

header{
  height:72px;
  background:#fff;
  border-bottom:1px solid #e2eeee;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  position:sticky;
  top:0;
  z-index:5
}

.brand{
  display:flex;
  gap:10px;
  align-items:center;
  text-decoration:none;
  color:#174b53
}

.mark{
  width:40px;
  height:40px;
  border-radius:7px;
  background:#1692a2;
  color:#fff;
  display:grid;
  place-items:center;
  font-size:28px;
  font-weight:bold
}

.brand h2{
  margin:0;
  font-size:18px
}

.brand small{
  font-size:8px;
  color:#77888a
}

.btn{
  border:0;
  border-radius:7px;
  padding:10px 15px;
  background:#eaf6f7;
  color:#17606a;
  font-weight:bold;
  cursor:pointer
}

.cart{
  background:#148d9e;
  color:#fff
}

.head{
  text-align:center;
  padding:38px 20px 25px
}

.head h1{
  margin:0;
  color:#174f58;
  font-size:31px
}

.head p{
  color:#78888b;
  font-size:13px
}

.tools{
  max-width:1120px;
  margin:auto;
  padding:0 20px 22px
}

.tools input{
  width:100%;
  padding:12px;
  border:1px solid #dce8e8;
  border-radius:8px;
  outline:0
}

.grid{
  max-width:1120px;
  margin:auto;
  padding:0 20px 50px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px
}

.product{
  background:#fff;
  border:1px solid #e2eeee;
  border-radius:12px;
  padding:14px;
  box-shadow:0 6px 20px #123f4710;
  display:flex;
  flex-direction:column
}

.pic{
  height:180px;
  border-radius:9px;
  background:#eef8f8;
  display:grid;
  place-items:center;
  overflow:hidden;
  font-size:52px
}

.pic img{
  width:100%;
  height:100%;
  object-fit:cover
}

.product h3{
  margin:14px 0 6px;
  color:#174f58;
  font-size:16px
}

.desc{
  font-size:12px;
  color:#7b898b;
  line-height:1.5;
  min-height:35px
}

.price{
  display:block;
  margin-top:10px;
  color:#148b9c;
  font-size:19px;
  font-weight:800
}

.add{
  width:100%;
  margin-top:11px;
  padding:10px;
  border:0;
  border-radius:7px;
  background:#148d9e;
  color:#fff;
  font-weight:bold;
  cursor:pointer
}

.add:hover{
  background:#0d7482
}

.empty{
  grid-column:1/-1;
  background:#fff;
  border:1px solid #e2eeee;
  border-radius:12px;
  padding:55px 20px;
  text-align:center;
  color:#78888b
}

.empty strong{
  display:block;
  color:#174f58;
  font-size:19px;
  margin-bottom:8px
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#123f47;
  color:#fff;
  padding:12px 16px;
  border-radius:8px;
  display:none;
  z-index:50
}

@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(2,1fr)
  }
}

@media(max-width:550px){
  .brand small{
    display:none
  }

  .grid{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<header>

<a class="brand" href="index.html#products">

<div class="mark">+</div>

<div>
<h2>MEDI POINT</h2>
<small>Your Trusted Healthcare Partner</small>
</div>

</a>

<div>

<button
class="btn"
onclick="location.href='index.html#products'">
← Categories
</button>

<button
class="btn cart"
onclick="location.href='order.html'">
🛒 Cart
</button>

</div>

</header>


<div class="head">

<h1 id="title">Medicines</h1>

<p>
Only medicines added from the Admin panel are shown here.
</p>

</div>


<div class="tools">

<input
id="search"
placeholder="🔎 Search medicine..."
oninput="render()"
>

</div>


<div id="grid" class="grid"></div>

<div id="toast" class="toast"></div>


<script>

/* --------------------------------
   SELECTED CATEGORY
-------------------------------- */

const cat =
new URLSearchParams(location.search).get("cat") || "medicine";


/* --------------------------------
   CATEGORY NAMES
-------------------------------- */

const names = {

"antibiotic":"Antibiotic",

"cough-cold":"Cough & Cold",

"cut-pain":"Cut & Pain",

"wound-fever":"Wound & Fever",

"baby-care":"Baby Care",

"eye-care":"Eye Care",

"skin-hair-care":"Skin & Hair Care",

"itching":"Itching",

"allergy":"Allergy",

"multi-vitamin":"Multi Vitamin",

"sexual-wellness":"Sexual Wellness",

"feminine-care-hygiene":"Feminine Care / Hygiene",

"period-care":"Period Care",

"fracture-care":"Fracture Care",

"sanitary-antiseptic":"Sanitary & Antiseptic",

"baby-food":"Baby Food",

"gastric-acidity":"Gastric & Acidity",

"diabetes-bp-care":"Diabetes & BP Care",

"calcium-iron":"Calcium & Iron",

"first-aid-medical-supplies":"First Aid & Medical Supplies"

};


/* --------------------------------
   CATEGORY NORMALIZATION
-------------------------------- */

function normalizeCategory(value){

  if(!value){
    return "medicine";
  }

  let text = String(value)
    .toLowerCase()
    .trim();

  /* remove extra spaces */
  text = text.replace(/\s+/g," ");

  /* convert category name to slug */
  const categoryMap = {

    "antibiotic":"antibiotic",

    "cough & cold":"cough-cold",
    "cough and cold":"cough-cold",
    "cough-cold":"cough-cold",

    "cut & pain":"cut-pain",
    "cut and pain":"cut-pain",
    "cut-pain":"cut-pain",

    "wound & fever":"wound-fever",
    "wound and fever":"wound-fever",
    "wound-fever":"wound-fever",

    "baby care":"baby-care",
    "baby-care":"baby-care",

    "eye care":"eye-care",
    "eye-care":"eye-care",

    "skin & hair care":"skin-hair-care",
    "skin and hair care":"skin-hair-care",
    "skin-hair-care":"skin-hair-care",

    "itching":"itching",

    "allergy":"allergy",

    "multi vitamin":"multi-vitamin",
    "multivitamin":"multi-vitamin",
    "multi-vitamin":"multi-vitamin",

    "sexual wellness":"sexual-wellness",
    "sexual-wellness":"sexual-wellness",

    "feminine care / hygiene":"feminine-care-hygiene",
    "feminine care hygiene":"feminine-care-hygiene",
    "feminine-care-hygiene":"feminine-care-hygiene",

    "period care":"period-care",
    "period-care":"period-care",

    "fracture care":"fracture-care",
    "fracture-care":"fracture-care",

    "sanitary & antiseptic":"sanitary-antiseptic",
    "sanitary and antiseptic":"sanitary-antiseptic",
    "sanitary-antiseptic":"sanitary-antiseptic",

    "baby food":"baby-food",
    "baby-food":"baby-food",

    "gastric & acidity":"gastric-acidity",
    "gastric and acidity":"gastric-acidity",
    "gastric-acidity":"gastric-acidity",

    "diabetes & bp care":"diabetes-bp-care",
    "diabetes and bp care":"diabetes-bp-care",
    "diabetes-bp-care":"diabetes-bp-care",

    "calcium & iron":"calcium-iron",
    "calcium and iron":"calcium-iron",
    "calcium-iron":"calcium-iron",

    "first aid & medical supplies":"first-aid-medical-supplies",
    "first aid and medical supplies":"first-aid-medical-supplies",
    "first-aid-medical-supplies":"first-aid-medical-supplies"

  };

  return categoryMap[text] || text.replace(/\s+/g,"-");

}


/* --------------------------------
   SET PAGE TITLE
-------------------------------- */

const selectedCategory =
normalizeCategory(cat);

document.getElementById("title").textContent =
names[selectedCategory] || "Products";


/* --------------------------------
   LOAD MEDICINES
-------------------------------- */

let products =
JSON.parse(
  localStorage.getItem("mediPointProducts") || "[]"
);


/* --------------------------------
   LOAD CART
-------------------------------- */

let cart =
JSON.parse(
  localStorage.getItem("mediPointCart") || "[]"
);


/* --------------------------------
   ESCAPE HTML
-------------------------------- */

function esc(v){

  return String(v ?? "").replace(
    /[&<>"']/g,

    function(m){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[m];

    }
  );

}


/* --------------------------------
   PRICE
-------------------------------- */

function money(v){

  return "₹" +
    Number(v || 0).toLocaleString("en-IN");

}


/* --------------------------------
   ADD TO CART
-------------------------------- */

function add(id){

  const p =
    products.find(
      x => Number(x.id) === Number(id)
    );

  if(!p) return;


  const old =
    cart.find(
      x => Number(x.id) === Number(id)
    );


  if(old){

    old.qty++;

  }else{

    cart.push({
      id:p.id,
      qty:1
    });

  }


  localStorage.setItem(
    "mediPointCart",
    JSON.stringify(cart)
  );


  const t =
    document.getElementById("toast");

  t.textContent =
    p.name + " added to cart ✓";

  t.style.display = "block";


  setTimeout(
    () => t.style.display = "none",
    1600
  );

}


/* --------------------------------
   RENDER MEDICINES
-------------------------------- */

function render(){

  const search =
    document
    .getElementById("search")
    .value
    .toLowerCase()
    .trim();


  /*
    IMPORTANT:
    Admin se category kisi bhi format mein aaye,
    normalizeCategory() usko same slug mein convert karega.
  */

  const list =
    products.filter(function(p){

      const productCategory =
        normalizeCategory(
          p.category ||
          p.cat ||
          p.categoryName ||
          "medicine"
        );


      const productName =
        String(
          p.name || ""
        ).toLowerCase();


      const categoryMatch =
        productCategory === selectedCategory;


      const searchMatch =
        productName.includes(search);


      return categoryMatch && searchMatch;

    });


  const grid =
    document.getElementById("grid");


  /* NO MEDICINE */

  if(!list.length){

    grid.innerHTML = `

      <div class="empty">

        <strong>No medicines added yet</strong>

        Admin panel se
        "${esc(names[selectedCategory] || selectedCategory)}"
        category mein medicine add karo.

      </div>

    `;

    return;

  }


  /* SHOW MEDICINES */

  grid.innerHTML =
    list.map(function(p){

      const image =
        p.image ||
        p.photo ||
        p.imageUrl ||
        "";


      return `

      <article class="product">

        <div class="pic">

          ${
            image

            ?

            `<img
              src="${esc(image)}"
              alt="${esc(p.name)}"
              onerror="
                this.style.display='none';
                this.parentElement.innerHTML='💊'
              "
            >`

            :

            "💊"
          }

        </div>


        <h3>
          ${esc(p.name)}
        </h3>


        <div class="desc">

          ${esc(
            p.desc ||
            p.description ||
            "Quality healthcare product"
          )}

        </div>


        <span class="price">

          ${money(p.price)}

        </span>


        <button
          class="add"
          onclick="add(${Number(p.id)})"
        >

          + Add to Cart

        </button>

      </article>

      `;

    }).join("");

}


/* --------------------------------
   START
-------------------------------- */

render();


/*
   If Admin panel changes localStorage
   while this page is open, refresh the
   medicines automatically.
*/

window.addEventListener(
  "storage",
  function(e){

    if(e.key === "mediPointProducts"){

      products =
        JSON.parse(
          localStorage.getItem(
            "mediPointProducts"
          ) || "[]"
        );

      render();

    }

  }
);

</script>

</body>
</html>
