<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEDI POINT | Order Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f9f9;color:#203b3d}.head{background:#fff;padding:16px 6%;border-bottom:1px solid #e2eeee}.brand{font-size:21px;font-weight:800;color:#087d80}.wrap{width:92%;max-width:1000px;margin:35px auto}.box{background:#fff;padding:24px;border-radius:17px;border:1px solid #e0ebeb;box-shadow:0 8px 28px #14464b10}h1{margin:0 0 6px;font-size:24px}p{color:#829294;font-size:12px}.search{display:flex;gap:10px;margin:20px 0}.search input{flex:1;padding:13px;border:1px solid #d6e4e5;border-radius:9px;text-transform:uppercase}.search button,.save{border:0;border-radius:9px;background:#087d80;color:white;padding:0 18px;font-weight:700;cursor:pointer}.card{border:1px solid #e2eeee;border-radius:12px;padding:16px;margin-top:15px}.row{display:flex;justify-content:space-between;gap:15px;margin:6px 0;font-size:12px}.status{margin-top:14px}.status select{width:100%;padding:12px;border:1px solid #d6e4e5;border-radius:9px}.save{margin-top:12px;width:100%;height:44px}.empty{text-align:center;padding:25px;color:#8a999b;font-size:13px}.ok{color:#26756b;background:#eefaf7;padding:10px;border-radius:8px;margin-top:10px;font-size:12px}
</style>
</head>
<body>
<header class="head"><div class="brand">⚕️ MEDI POINT — Order Admin</div></header>
<main class="wrap"><section class="box">
<h1>📦 Manage Order Status</h1><p>Enter an Order ID to update its delivery status.</p>
<div class="search"><input id="id" placeholder="MP-20260810-12345"><button onclick="find()">Search</button></div>
<div id="out" class="empty">No order selected.</div>
</section></main>
<script>
const statuses=["Order Placed","Order Confirmed","Preparing","Out for Delivery","Delivered"];
let current=null;
function find(){let id=document.getElementById("id").value.trim().toUpperCase(),raw=localStorage.getItem("mediPointOrder_"+id),o=document.getElementById("out");if(!raw){o.innerHTML="❌ Order not found.";return}current={key:"mediPointOrder_"+id,data:JSON.parse(raw)};render()}
function render(){let o=current.data;document.getElementById("out").innerHTML=`<div class="card"><b>Order ID: ${esc(o.id)}</b><div class="row"><span>Customer</span><strong>${esc(o.name)}</strong></div><div class="row"><span>Mobile</span><strong>${esc(o.phone)}</strong></div><div class="row"><span>Total</span><strong>₹${Number(o.total||0).toFixed(2)}</strong></div><div class="status"><label>Status</label><select id="status">${statuses.map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select><button class="save" onclick="save()">💾 Update Order Status</button><div id="msg"></div></div></div>`}
function save(){let status=document.getElementById("status").value;current.data.status=status;current.data.updatedAt=new Date().toISOString();localStorage.setItem(current.key,JSON.stringify(current.data));document.getElementById("msg").innerHTML='<div class="ok">✅ Status updated successfully. Customer tracking page will show the new status on the same browser/device.</div>'}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
</script>
</body>
</html>
