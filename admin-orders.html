<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MEDI POINT | Order Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f9f9;
  color:#203b3d;
}

.header{
  background:#fff;
  padding:16px 6%;
  border-bottom:1px solid #e2eeee;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:10;
}

.brand{
  font-size:21px;
  font-weight:800;
  color:#087d80;
}

.back{
  text-decoration:none;
  color:#087d80;
  font-size:13px;
  font-weight:bold;
}

.wrap{
  width:92%;
  max-width:1050px;
  margin:35px auto;
}

.box{
  background:#fff;
  padding:25px;
  border-radius:17px;
  border:1px solid #e0ebeb;
  box-shadow:0 8px 28px #14464b10;
}

h1{
  margin:0 0 6px;
  font-size:25px;
}

.sub{
  color:#829294;
  font-size:12px;
  margin:0 0 25px;
}

.search{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.search input{
  flex:1;
  padding:14px;
  border:1px solid #d6e4e5;
  border-radius:9px;
  outline:none;
  text-transform:uppercase;
  font-size:14px;
}

.search input:focus{
  border-color:#087d80;
}

.search button{
  border:0;
  border-radius:9px;
  background:#087d80;
  color:white;
  padding:0 22px;
  font-weight:700;
  cursor:pointer;
}

.order-card{
  border:1px solid #e1eeee;
  border-radius:14px;
  padding:20px;
  margin-top:18px;
  background:#fff;
}

.order-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
  padding-bottom:15px;
  border-bottom:1px solid #edf3f3;
}

.order-id{
  font-size:18px;
  font-weight:800;
  color:#087d80;
}

.order-date{
  font-size:11px;
  color:#89999b;
}

.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:18px;
}

.info{
  background:#f7fbfb;
  padding:12px;
  border-radius:9px;
  font-size:12px;
}

.info b{
  display:block;
  color:#174f58;
  margin-bottom:4px;
}

.status-box{
  margin-top:18px;
  padding-top:18px;
  border-top:1px dashed #dbe7e7;
}

.status-box label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:8px;
}

.status-box select{
  width:100%;
  padding:13px;
  border:1px solid #d6e4e5;
  border-radius:9px;
  font-size:13px;
  outline:none;
  background:#fff;
}

.save{
  width:100%;
  margin-top:12px;
  height:45px;
  border:0;
  border-radius:9px;
  background:#087d80;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.save:hover{
  background:#06696c;
}

.save:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.products{
  margin-top:18px;
  padding-top:18px;
  border-top:1px solid #edf3f3;
}

.products h3{
  font-size:14px;
  color:#174f58;
  margin:0 0 10px;
}

.product-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid #f0f4f4;
  font-size:12px;
}

.product-row:last-child{
  border-bottom:0;
}

.empty{
  text-align:center;
  padding:30px;
  color:#89999b;
  font-size:13px;
}

.loading{
  text-align:center;
  padding:30px;
  color:#087d80;
  font-size:13px;
}

.error{
  text-align:center;
  padding:18px;
  color:#b44;
  background:#fff4f4;
  border-radius:10px;
  font-size:12px;
}

.message{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#123f47;
  color:#fff;
  padding:13px 18px;
  border-radius:9px;
  display:none;
  z-index:100;
  box-shadow:0 6px 20px rgba(0,0,0,.15);
}

@media(max-width:650px){

  .header{
    padding:14px 4%;
  }

  .wrap{
    width:94%;
    margin:22px auto;
  }

  .box{
    padding:18px;
  }

  .search{
    flex-direction:column;
  }

  .search button{
    height:45px;
  }

  .info-grid{
    grid-template-columns:1fr;
  }

  .order-top{
    flex-direction:column;
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="brand">
    ⚕️ MEDI POINT — Order Admin
  </div>

  <a href="admin.html" class="back">
    ← Admin Panel
  </a>

</header>


<main class="wrap">

<section class="box">

<h1>📦 Manage Orders</h1>

<p class="sub">
Search an Order ID and update the customer's delivery status.
</p>


<div class="search">

  <input
    id="orderSearch"
    type="text"
    placeholder="Example: MP-20260810-12345"
  >

  <button onclick="searchOrder()">
    🔎 Search Order
  </button>

</div>


<div id="result">

  <div class="empty">
    Enter an Order ID to manage the order.
  </div>

</div>

</section>

</main>


<div
  class="message"
  id="message">
</div>


<script type="module">

/* =========================
   FIREBASE
========================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  doc,
  updateDoc,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyDDY8sEtMapyVhiQd5AfcRb599dsgFwMcE",

  authDomain:
    "medipoint-f4616.firebaseapp.com",

  projectId:
    "medipoint-f4616",

  storageBucket:
    "medipoint-f4616.firebasestorage.app",

  messagingSenderId:
    "180492377336",

  appId:
    "1:180492377336:web:5f6566cd6663ed43a12f0d",

  measurementId:
    "G-C8X32M4CKF"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================
   STATUS LIST
========================= */

const statuses = [

  "Order Placed",

  "Order Confirmed",

  "Preparing",

  "Out for Delivery",

  "Delivered"

];


/* =========================
   GLOBAL
========================= */

let currentOrder = null;


/* =========================
   SEARCH ORDER
========================= */

window.searchOrder = async function(){

  const input =
    document.getElementById("orderSearch");

  const result =
    document.getElementById("result");

  const id =
    input.value.trim().toUpperCase();


  if(!id){

    showMessage("❌ Please enter Order ID.");

    return;

  }


  result.innerHTML = `
    <div class="loading">
      ⏳ Searching order...
    </div>
  `;


  try{

    /*
      Orders collection mein
      orderId field search hoga.
    */

    const q = query(
      collection(db,"orders"),
      where("orderId","==",id)
    );


    const snapshot =
      await getDocs(q);


    if(snapshot.empty){

      result.innerHTML = `
        <div class="error">
          ❌ Order not found.<br><br>
          Please check the Order ID.
        </div>
      `;

      return;

    }


    const orderDoc =
      snapshot.docs[0];


    currentOrder = {

      id:orderDoc.id,

      ...orderDoc.data()

    };


    renderOrder(currentOrder);


    /*
      Real-time listener.
      Customer ya admin side se status
      change hone par screen update hogi.
    */

    listenToOrder(orderDoc.id);


  }catch(error){

    console.error(
      "SEARCH ERROR:",
      error
    );


    result.innerHTML = `
      <div class="error">

        ❌ Firebase Error

        <br><br>

        ${escapeHTML(error.message)}

      </div>
    `;

  }

};


/* =========================
   REAL TIME ORDER
========================= */

function listenToOrder(documentId){

  const orderRef =
    doc(db,"orders",documentId);


  onSnapshot(
    orderRef,

    snapshot=>{

      if(!snapshot.exists()){

        document.getElementById("result").innerHTML = `
          <div class="error">
            ❌ This order no longer exists.
          </div>
        `;

        return;

      }


      currentOrder = {

        id:snapshot.id,

        ...snapshot.data()

      };


      renderOrder(currentOrder);

    },

    error=>{

      console.error(
        "REALTIME ERROR:",
        error
      );

    }

  );

}


/* =========================
   RENDER ORDER
========================= */

function renderOrder(o){

  const result =
    document.getElementById("result");


  const status =
    o.status || "Order Placed";


  let productsHTML = "";


  if(
    Array.isArray(o.items) &&
    o.items.length
  ){

    productsHTML =
      o.items.map(item=>`

        <div class="product-row">

          <span>
            ${escapeHTML(
              item.name || "Medicine"
            )}
            × ${Number(
              item.quantity || 1
            )}
          </span>

          <b>
            ₹${Number(
              item.price || 0
            ).toFixed(2)}
          </b>

        </div>

      `).join("");

  }else{

    productsHTML = `
      <div class="product-row">
        <span>Order items</span>
        <span>Available in order</span>
      </div>
    `;

  }


  const dateText =
    formatDate(
      o.createdAt
    );


  result.innerHTML = `

    <div class="order-card">


      <div class="order-top">

        <div>

          <div class="order-id">
            ${escapeHTML(
              o.orderId || o.id
            )}
          </div>

          <div class="order-date">
            ${dateText}
          </div>

        </div>


        <div>
          📦 ${escapeHTML(status)}
        </div>

      </div>


      <div class="info-grid">


        <div class="info">

          <b>Customer</b>

          ${escapeHTML(
            o.name ||
            o.customerName ||
            "Not available"
          )}

        </div>


        <div class="info">

          <b>Mobile</b>

          ${escapeHTML(
            o.phone ||
            o.mobile ||
            "Not available"
          )}

        </div>


        <div class="info">

          <b>Payment</b>

          ${escapeHTML(
            o.payment ||
            o.paymentMethod ||
            "Not available"
          )}

        </div>


        <div class="info">

          <b>Total</b>

          ₹${Number(
            o.total || 0
          ).toFixed(2)}

        </div>


        <div class="info">

          <b>Address</b>

          ${escapeHTML(
            o.address ||
            "Not available"
          )}

        </div>


        <div class="info">

          <b>Email</b>

          ${escapeHTML(
            o.email ||
            "Not available"
          )}

        </div>


      </div>


      <div class="products">

        <h3>
          🛒 Ordered Medicines
        </h3>

        ${productsHTML}

      </div>


      <div class="status-box">

        <label>
          🚚 Update Order Status
        </label>


        <select id="statusSelect">

          ${statuses.map(s=>`

            <option
              value="${escapeHTML(s)}"
              ${s === status ? "selected" : ""}
            >
              ${escapeHTML(s)}
            </option>

          `).join("")}

        </select>


        <button
          class="save"
          id="saveStatusBtn"
          onclick="updateStatus()"
        >
          💾 Update Status
        </button>

      </div>


    </div>

  `;

}


/* =========================
   UPDATE STATUS
========================= */

window.updateStatus = async function(){

  if(!currentOrder){

    showMessage(
      "❌ Please search an order first."
    );

    return;

  }


  const select =
    document.getElementById(
      "statusSelect"
    );

  const button =
    document.getElementById(
      "saveStatusBtn"
    );


  if(!select || !button) return;


  const newStatus =
    select.value;


  try{

    button.disabled = true;

    button.textContent =
      "⏳ Updating...";


    const orderRef =
      doc(
        db,
        "orders",
        currentOrder.id
      );


    await updateDoc(
      orderRef,
      {

        status:newStatus,

        updatedAt:new Date()

      }
    );


    showMessage(
      "✅ Order status updated successfully!"
    );


  }catch(error){

    console.error(
      "UPDATE ERROR:",
      error
    );


    showMessage(
      "❌ Update failed: " +
      error.message
    );


  }finally{

    button.disabled = false;

    button.textContent =
      "💾 Update Status";

  }

};


/* =========================
   DATE
========================= */

function formatDate(value){

  if(!value){

    return "Date not available";

  }


  try{

    if(
      value &&
      typeof value.toDate === "function"
    ){

      return value
        .toDate()
        .toLocaleString("en-IN");

    }


    if(value.seconds){

      return new Date(
        value.seconds * 1000
      ).toLocaleString("en-IN");

    }


    return new Date(value)
      .toLocaleString("en-IN");

  }catch{

    return "Date not available";

  }

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   MESSAGE
========================= */

function showMessage(text){

  const box =
    document.getElementById(
      "message"
    );


  box.textContent = text;

  box.style.display =
    "block";


  setTimeout(()=>{

    box.style.display =
      "none";

  },5000);

}


/* =========================
   ENTER KEY
========================= */

document
  .getElementById("orderSearch")
  .addEventListener(
    "keydown",
    e=>{

      if(e.key === "Enter"){

        e.preventDefault();

        searchOrder();

      }

    }
  );

</script>

</body>
</html>
